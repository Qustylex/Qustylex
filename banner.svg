<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Qustylex</title>
  <desc id="desc">Qustylex: security and OSINT research workspace. URL Scanner, Network Intel, curated directory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <rect x="80" y="70" width="4" height="160" fill="#ffffff"/>

  <text x="110" y="142" font-family="Helvetica, Arial, sans-serif" font-size="80" font-weight="700" fill="#ffffff" letter-spacing="8">QUSTYLEX</text>
  <text x="113" y="188" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#ffffff" fill-opacity="0.9" letter-spacing="4">SECURITY AND OSINT RESEARCH WORKSPACE</text>
  <text x="113" y="222" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" fill-opacity="0.5" letter-spacing="3">URL SCANNER  ·  NETWORK INTEL  ·  CURATED DIRECTORY</text>

  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <line x1="900" y1="90" x2="1010" y2="150"/>
    <line x1="1010" y1="150" x2="1110" y2="90"/>
    <line x1="1010" y1="150" x2="930" y2="220"/>
    <line x1="930" y1="220" x2="1110" y2="230"/>
    <line x1="1010" y1="150" x2="1110" y2="230"/>
  </g>
  <g fill="#ffffff">
    <circle cx="900" cy="90" r="6"/>
    <circle cx="1110" cy="90" r="6"/>
    <circle cx="1010" cy="150" r="10"/>
    <circle cx="930" cy="220" r="6"/>
    <circle cx="1110" cy="230" r="6"/>
  </g>
  <circle cx="1010" cy="150" r="22" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>

  <text x="1160" y="278" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.4" letter-spacing="2">v1.0</text>
