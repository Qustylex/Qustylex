<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Qustylex</title>
  <desc id="desc">Qustylex: independent product catalog for reselling and dropshipping. Sourcing from AliExpress, Alibaba, Temu, Shein and Wish, with profit calculator and API.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#141414"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <rect x="80" y="64" width="4" height="184" fill="#ffffff"/>

  <text x="110" y="138" font-family="Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#ffffff" letter-spacing="8">QUSTYLEX</text>

  <text x="113" y="178" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#ffffff" fill-opacity="0.9" letter-spacing="4">INDEPENDENT PRODUCT CATALOG</text>
  <text x="113" y="206" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#ffffff" fill-opacity="0.9" letter-spacing="4">RESELLING &amp; DROPSHIPPING</text>

  <text x="113" y="238" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" fill-opacity="0.55" letter-spacing="3">ALIEXPRESS  ·  ALIBABA  ·  TEMU  ·  SHEIN  ·  WISH</text>

  <g>
    <rect x="840" y="56" width="300" height="188" rx="16" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.2"/>


    <circle cx="866" cy="82" r="4" fill="#ffffff"/>
    <text x="878" y="87" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" fill-opacity="0.7" letter-spacing="2">CATALOG · LIVE</text>
    <text x="1120" y="87" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.35" letter-spacing="1">v1.0</text>


    <path d="M860 190 L905 176 L950 182 L995 158 L1040 146 L1085 120 L1120 108 L1120 198 L860 198 Z"
          fill="#ffffff" fill-opacity="0.05"/>
    <polyline points="860,190 905,176 950,182 995,158 1040,146 1085,120 1120,108"
              fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="1120" cy="108" r="4" fill="#ffffff"/>


    <g font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#ffffff" fill-opacity="0.75" letter-spacing="1.5" text-anchor="middle">
      <rect x="860" y="206" width="88" height="20" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="904" y="220">24H SYNC</text>

      <rect x="956" y="206" width="56" height="20" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="984" y="220">API</text>

      <rect x="1020" y="206" width="100" height="20" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="1070" y="220">NO SIGNUP</text>
    </g>
  </g>


  <text x="1160" y="278" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" fill-opacity="0.4" letter-spacing="2">5 SOURCES · 10 MARKETPLACES</text>
</svg>
